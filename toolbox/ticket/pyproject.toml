[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket"
version = "0.1.0"
description = "12306 quick query CLI — a learning project"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ticket = "ticket.cli:main"

[tool.setuptools.packages.find]
include = ["ticket*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
